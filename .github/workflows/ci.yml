name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        # config.ts runs envSchema.parse(process.env) at module load, so any
        # test that transitively imports db.ts → config.ts needs DATABASE_URL
        # set even if no test actually opens the connection. A dummy value
        # is fine — none of the pure-function tests touch the DB.
        env:
          DATABASE_URL: postgres://test@localhost:5432/test
        run: bun test
