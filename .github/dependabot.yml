# Dependabot version updates.
# Security updates are enabled repo-wide and are not controlled by this file.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bun" # bun.lock
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Group routine bumps into a single weekly PR.
    # Majors stay ungrouped — they get their own PR and a real review.
    # (dependency-type grouping is npm-only, so this groups by pattern.)
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
